name: libragent
base: core22
version: '0.9.9'
summary: A desktop app for AI agents with built-in tools
description: |
  LibrAgent is a next-generation desktop AI agent platform that combines the lightness of Tauri with the intuitiveness of React. Users can automate all daily tasks by giving AI agents their own unique personalities and abilities.

grade: stable
confinement: strict

apps:
  libragent:
    command: bin/libragent
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind
      - opengl
      - x11
      - wayland
      - desktop
      - desktop-legacy

parts:
  libragent:
    plugin: dump
    source: src-tauri/target/release/bundle/deb/libragent_0.9.9_amd64.deb
    source-type: deb
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libappindicator3-1
      - librsvg2-2
      - libssl3
