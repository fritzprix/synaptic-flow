[package]
name = "libragent"
version = "0.9.9"
description = "A desktop app for AI agents with built-in tools"
authors = ["fritzprix"]
license = "MIT"
repository = "https://github.com/fritzprix/libr-agent.git"
edition = "2021"
rust-version = "1.88"
keywords = ["ai", "agent", "multi-agent", "orchestration", "mcp", "model-context-protocol", "react", "desktop", "shareable-config"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_mcp_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false
# NOTE: lib unit tests are disabled due to cdylib linkage requirements.
# All tests live in tests/ and are run with: cargo test --tests

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-response-guards = { path = "agent-response-guards" }
tauri = { version = "2", features = ["protocol-asset", "test"] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1.52", features = ["full"] }
uuid = { version = "1.23", features = ["v4"] }
anyhow = "1.0"
tokio-util = "0.7"
futures = "0.3"
rmcp = { version = "0.10.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-sse-client-reqwest", "auth"] }
oauth2 = "4.4"
keyring = "4.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tauri-plugin-log = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
log = "0.4.30"
fern = "0.7"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
path-clean = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.16"
walkdir = "2.4"
glob = "0.3"
ignore = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["sha2", "hmac"] }
html-escape = "0.2"
html2md = "0.2"           # HTML to Markdown conversion
tiktoken-rs = "0.11"       # OpenAI tokenizer for accurate token-based pagination
warp = "0.3"
dashmap = "6.2"
regex = "1"
cuid2 = "0.1.6"
dirs = "6.0"
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
handlebars = "6.4"
ammonia = "4.0"
jsonschema = "0.49"

# Windows-only: ANSI code-page decode for stdio; ExpandEnvironmentStrings for registry PATH;
# taskbar visibility styles (APPWINDOW / TOOLWINDOW) for minimize behavior.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Environment",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# File parsing dependencies
docx-rs = "0.4"           # DOCX parsing
calamine = { version = "0.36", features = ["dates"] }  # XLSX parsing
lopdf = "0.31"            # PDF parsing
pdf-extract = "0.12"       # Better PDF text extraction
markdown2pdf = "1.5"      # Proven Markdown → PDF (github theme) for message export
# tantivy = "0.21"       # BM25 text search - temporarily disabled due to zstd conflicts
bm25 = { version = "2.3.2", features = ["parallelism"] }  # BM25 search with parallel indexing
base64 = "0.23.0"
once_cell = "1.21"        # Lazy static initialization
bincode = "1.3"           # Binary serialization for index persistence
dotenvy = "0.15"
url = "2"                 # URL parsing for file:// URL handling

# SeaORM dependencies for database ORM
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
migration = { path = "migration" }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
tauri-plugin-mcp-bridge = "0.13.0"
sqlite-vec = "0.1.9"
fastembed = "5.15.0"

[target.'cfg(windows)'.dependencies]
# Read HKCU/HKLM Path so GUI-launched isolation recovers user tool dirs (cargo, uv, npm, …)
winreg = "0.56"

[features]
default = ["workspace-str-replace"]
workspace-edit-file = []
workspace-str-replace = []

[dev-dependencies]
# test-util enables tokio::time::pause() / advance() for time-controlled async tests.
tokio = { version = "1.52", features = ["test-util"] }

[profile.ci-test]
inherits = "test"
debug = 0
incremental = false

[workspace]
members = ["migration", "agent-response-guards"]
