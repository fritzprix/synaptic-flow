name: LibrAgent CI/CD

on:
  push:
    branches: [main, master, 'dev/*']
  pull_request:
    branches: [main, master, 'dev/*']

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo bin on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ runner.os != 'Windows' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint

      - name: Check obsolete builtin tool names
        run: pnpm tool-names:check

      - name: Validate bundled skills
        if: matrix.os == 'ubuntu-latest'
        run: pnpm skills:audit

      - name: Check skills mirror drift
        if: matrix.os == 'ubuntu-latest'
        run: pnpm skills:mirror:check

      - name: Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Run tests (if available)
        run: pnpm test || echo "No tests defined"

      - name: Check TypeScript
        run: pnpm tsc --noEmit

      - name: Check bundle budget (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build && pnpm perf:bundle

      - name: Check Rust
        run: cd src-tauri && cargo check

      - name: Fix macOS SDKROOT for Rust linker
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Run Rust integration tests
        run: pnpm rust:test

      - name: Run Rust integration tests (edit-file build)
        run: pnpm rust:test:edit-file

      # Code Quality Checks (PR only)
      - name: Install Clippy
        run: rustup component add clippy
      - name: Rust Clippy (PR)
        if: github.event_name == 'pull_request'
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Rust Format Check (PR)
        if: github.event_name == 'pull_request'
        run: cd src-tauri && cargo fmt --check

      # Security Checks (PR only)
      - name: npm audit (PR)
        if: github.event_name == 'pull_request'
        run: pnpm audit --audit-level high
        continue-on-error: true

      - name: Cargo audit (PR)
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-audit
          cd src-tauri && cargo audit
        continue-on-error: true

  build:
    name: Build
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure Cargo bin on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            pkg-config \
            libgtk-3-dev

      - name: Set PKG_CONFIG_PATH (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - name: Build Tauri app
        # macOS GitHub runners flake in bundle_dmg.sh (hdiutil detach timeout).
        # PR CI still builds LibrAgent.app; release/nightly keep producing DMGs.
        run: |
          extra_args=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra_args+=(--bundles app)
          fi
          pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}' "${extra_args[@]}"
        shell: bash
        env:
          # Use dummy value for CI if needed, but --config override is preferred
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libragent-build-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
          retention-days: 7
